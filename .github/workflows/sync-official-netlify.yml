name: Sync official GPROXY Netlify bundle

on:
  workflow_dispatch:
  push:
    branches: [deploy]
    paths:
      - ".github/workflows/sync-official-netlify.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy
          fetch-depth: 0
      - name: Download exact official v3.0.20 Netlify release bundle
        run: |
          set -euo pipefail
          curl -fL -o /tmp/gproxy-edge-netlify.zip \
            https://github.com/LeenHawk/gproxy/releases/download/v3.0.20/gproxy-edge-netlify.zip
          echo "3ecc524e07dd8a014d0383985a64c5522cf77270338fdb136bc5ceada3f4afae  /tmp/gproxy-edge-netlify.zip" | sha256sum -c -
      - name: Replace repository contents with official bundle
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          unzip -q /tmp/gproxy-edge-netlify.zip -d "$tmp"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          shopt -s dotglob nullglob
          cp -a "$tmp"/* .
      - name: Commit exact official bundle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already identical to official v3.0.20 Netlify bundle."
            exit 0
          fi
          git commit -m "chore: replace with official GPROXY v3.0.20 Netlify bundle"
          git push origin deploy
